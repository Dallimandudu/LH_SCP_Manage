<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육 만족도 조사 통합 관리자</title>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #000000, #001529, #87CEEB);
            background-attachment: fixed; margin: 0; padding: 0; color: #333; 
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin: 50px auto; max-width: 900px; padding: 40px;
        }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { width: 450px; text-align: center; }
        .login-box h2 { font-size: 32px; margin-bottom: 10px; }
        .login-box input { padding: 18px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 8px; width: 85%; font-size: 20px; text-align: center; }
        .login-box button { padding: 18px; width: 85%; background-color: #001529; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 20px; transition: 0.3s; }
        .login-box button:hover { background-color: #003366; }

        #main-screen { display: none; }
        .header-title { border-bottom: 2px solid #001529; padding-bottom: 15px; margin-bottom: 30px; text-align: center; font-size: 28px; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .session-btn {
            background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px;
            padding: 30px 10px; font-size: 22px; font-weight: bold; color: #001529;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .session-btn:hover { background: #e3f2fd; border-color: #0d47a1; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }

        #detail-screen { display: none; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #001529; padding-bottom: 15px; }
        .back-btn { padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .back-btn:hover { background: #5a6268; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #f4f6f9; padding: 25px; border-radius: 12px; text-align: center; }
        .stat-card h4 { margin: 0 0 10px 0; color: #555; font-size: 18px; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #001529; }
        
        .link-group { display: flex; gap: 15px; justify-content: center; }
        .action-btn { padding: 15px 30px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; transition: 0.2s; }
        .action-btn.survey { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
        .action-btn.sheet { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .action-btn:hover { filter: brightness(0.95); }

        #loading { display: none; text-align: center; font-size: 20px; color: #0056b3; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="panel login-box">
            <h2>🔒 Admin Portal</h2>
            <input type="password" id="pw-input" placeholder="비밀번호" onkeypress="if(event.keyCode==13) checkPassword()">
            <br>
            <button onclick="checkPassword()">대시보드 접속</button>
        </div>
    </div>

    <div id="main-screen" class="panel">
        <h2 class="header-title">📊 교육 만족도 차수 선택</h2>
        <div class="grid-container" id="button-grid">
            <!-- 버튼 자동 생성 -->
        </div>
    </div>

    <div id="detail-screen" class="panel">
        <div class="detail-header">
            <h2 id="detail-title">O차수 만족도 현황</h2>
            <button class="back-btn" onclick="showMainScreen()">← 목록으로</button>
        </div>
        
        <div id="loading">데이터를 실시간으로 불러오는 중입니다... ⏳</div>

        <div id="detail-content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>1일차 응답 수</h4>
                    <div class="value" id="day1-count">-</div>
                </div>
                <div class="stat-card">
                    <h4>2~3일차 응답 수</h4>
                    <div class="value" id="day2-count">-</div>
                </div>
                <div class="stat-card">
                    <h4>정량평가 통합 평균</h4>
                    <div class="value"><span id="avg-score">-</span>점</div>
                </div>
            </div>

            <div class="link-group">
                <a href="#" id="link-survey" target="_blank" class="action-btn survey">📝 설문 링크 열기</a>
                <a href="#" id="link-sheet" target="_blank" class="action-btn sheet">📊 원본 시트 열기</a>
            </div>
        </div>
    </div>

    <script>
        // 관리자 비밀번호
        const ADMIN_PW = "6611"; 
        
        // 새로 생성하신 웹 앱 URL 적용 완료
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxcnkKyQ6xSp8g9OsotYCP6hKj-3AKgcvI_aUKVYGzt7LU8Kx36i6T3y02WMY8ZbzWs/exec"; 
        
        // 차수별 원본 구글 시트 ID 세팅 (5차수 세팅 완료)
        const sheetData = {
            5: { id: "1OdQrGuEouQDczRtmetVOstX9HKNQUTXigwyL-kchFio" },
            6: { id: "" },
            7: { id: "" },
            8: { id: "" },
            9: { id: "" },
            10: { id: "" },
            11: { id: "" },
            12: { id: "" }
        };

        const sessions = [5, 6, 7, 8, 9, 10, 11, 12];

        function checkPassword() {
            if (document.getElementById('pw-input').value === ADMIN_PW) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                renderButtons();
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        function renderButtons() {
            const grid = document.getElementById('button-grid');
            grid.innerHTML = '';
            sessions.forEach(session => {
                let btn = document.createElement('button');
                btn.className = 'session-btn';
                btn.innerText = session + "차수";
                btn.onclick = () => showDetailScreen(session);
                grid.appendChild(btn);
            });
        }

        function showMainScreen() {
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        async function showDetailScreen(session) {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
            
            document.getElementById('detail-title').innerText = session + "차수 교육 만족도 현황";
            document.getElementById('detail-content').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            document.getElementById('link-survey').href = `https://dallimandudu.github.io/LH-SCP-Subey_${session}st/`;
            document.getElementById('link-sheet').href = `https://docs.google.com/spreadsheets/d/${sheetData[session].id}/edit`;

            const sheetId = sheetData[session].id;
            
            if (!sheetId) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('detail-content').style.display = 'block';
                document.getElementById('day1-count').innerText = "시트연결필요";
                document.getElementById('day2-count').innerText = "-";
                document.getElementById('avg-score').innerText = "-";
                return;
            }

            try {
                // 스크립트에서 숫자만 걸러내어 평균을 내도록 호출
                const response = await fetch(`${GAS_URL}?sheetId=${sheetId}`);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('detail-content').style.display = 'block';

                if (data.status === "success") {
                    document.getElementById('day1-count').innerText = data.day1Count + "명";
                    document.getElementById('day2-count').innerText = data.day2_3Count + "명";
                    document.getElementById('avg-score').innerText = data.avgScore;
                } else {
                    alert("데이터를 불러오지 못했습니다: " + data.message);
                }
            } catch (error) {
                alert("통신 오류가 발생했습니다.");
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
