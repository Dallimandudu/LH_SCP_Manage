<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육 만족도 조사 통합 관리자</title>
    <style>
        /* 1. 요청하신 검정 -> 진한 네이비 -> 연한 하늘색 그라데이션 배경 */
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #000000, #001529, #87CEEB);
            background-attachment: fixed; /* 스크롤해도 배경 고정 */
            margin: 0; 
            padding: 0; 
            color: #333; 
        }
        
        /* 2. 로그인 화면 스타일 (훨씬 더 크게 수정) */
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .login-box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 60px 50px; /* 패딩을 넓혀서 박스를 크게 */
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            width: 450px; /* 가로 길이 확대 */
            max-width: 90%; 
        }
        .login-box h2 { font-size: 32px; margin-bottom: 10px; color: #111; }
        .login-box p { font-size: 16px; color: #555; margin-bottom: 30px; }
        
        /* 입력창 크기 대폭 확대 */
        .login-box input { 
            padding: 18px; 
            margin: 10px 0 20px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            width: 85%; 
            font-size: 20px; 
            box-sizing: border-box;
            text-align: center;
        }
        
        /* 버튼 크기 대폭 확대 */
        .login-box button { 
            padding: 18px; 
            width: 85%; 
            background-color: #001529; /* 버튼 색상도 네이비 톤으로 통일감 있게 */
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 20px; 
            transition: background 0.3s;
        }
        .login-box button:hover { background-color: #003366; }

        /* 3. 대시보드 화면 스타일 (어두운 배경 위에서 돋보이게 흰색 패널 처리) */
        #dashboard-screen { 
            display: none; 
            padding: 40px; 
            max-width: 1000px; 
            margin: 50px auto; 
            background: rgba(255, 255, 255, 0.98); /* 흰색 패널 */
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #001529; padding-bottom: 10px; }
        .header h2 { margin: 0; color: #111; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 16px; text-align: center; border-bottom: 1px solid #eee; font-size: 15px; }
        th { background-color: #f8f9fa; font-weight: 600; color: #444; }
        tr:hover { background-color: #f1f7ff; }
        
        .link-btn { display: inline-block; padding: 8px 14px; background-color: #e9ecef; color: #333; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .link-btn.primary { background-color: #e3f2fd; color: #0d47a1; }
        .link-btn:hover { background-color: #dee2e6; }
        .link-btn.primary:hover { background-color: #bbdefb; }
        
        .refresh-btn { padding: 10px 20px; background-color: #001529; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .refresh-btn:hover { background-color: #003366; }
    </style>
</head>
<body>

    <!-- 비밀번호 입력 화면 -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Admin Portal</h2>
            <p>관리자 비밀번호를 입력해 주세요.</p>
            <input type="password" id="pw-input" placeholder="비밀번호" onkeypress="if(event.keyCode==13) checkPassword()">
            <br>
            <button onclick="checkPassword()">대시보드 접속</button>
        </div>
    </div>

    <!-- 실제 대시보드 화면 -->
    <div id="dashboard-screen">
        <div class="header">
            <h2>📊 차수별 교육 만족도 현황 (5차수 ~ 12차수)</h2>
            <button class="refresh-btn" onclick="location.reload()">데이터 새로고침</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>차수</th>
                    <th>설문 링크</th>
                    <th>원본 시트</th>
                    <th>응답 수</th>
                    <th>평균 만족도</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <!-- 데이터가 자바스크립트를 통해 여기에 생성됩니다 -->
            </tbody>
        </table>
    </div>

    <script>
        // 관리자 비밀번호
        const ADMIN_PW = "6611"; 

        function checkPassword() {
            const input = document.getElementById('pw-input').value;
            if (input === ADMIN_PW) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                loadDashboardData();
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        // 5차수~12차수 기본 세팅
        const sessions = [5, 6, 7, 8, 9, 10, 11, 12];
        
        // 각 차수별 구글 시트 링크
        const sheetLinks = {
            5: "https://docs.google.com/spreadsheets/d/1OdQrGuEouQDczRtmetVOstX9HKNQUTXigwyL-kchFio/edit?usp=sharing",
            6: "https://docs.google.com/spreadsheets/d/...",
            7: "https://docs.google.com/spreadsheets/d/...",
            8: "https://docs.google.com/spreadsheets/d/...",
            9: "https://docs.google.com/spreadsheets/d/...",
            10: "https://docs.google.com/spreadsheets/d/...",
            11: "https://docs.google.com/spreadsheets/d/...",
            12: "https://docs.google.com/spreadsheets/d/..."
        };

        function loadDashboardData() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = ''; // 초기화

            sessions.forEach(session => {
                let mockResponseCount = "-"; 
                let mockAvgScore = "-";

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${session}차수</strong></td>
                    <td><a href="https://dallimandudu.github.io/LH-SCP-Subey_${session}st/" target="_blank" class="link-btn primary">설문 열기</a></td>
                    <td><a href="${sheetLinks[session] || '#'}" target="_blank" class="link-btn">시트 확인</a></td>
                    <td>${mockResponseCount}</td>
                    <td>${mockAvgScore}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
