<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 LH SCP 만족도 관리자 시트</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />

    <style>
        /* 전체 배경 순백색 적용 및 미니멀라이징 */
        body { 
            font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; 
            background: #ffffff; /* 순백색 배경 */
            margin: 0; padding: 0; color: #222; 
            letter-spacing: -0.02em;
        }
        
        /* 패널: 그림자/테두리 최소화하여 플랫하고 깔끔하게 변경 */
        .panel {
            background: #ffffff; 
            border-radius: 16px; 
            margin: 40px auto; 
            max-width: 900px; 
            padding: 40px 20px;
        }

        /* 1. 로그인 화면 */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { width: 400px; text-align: center; }
        .login-box h2 { font-size: 26px; margin-bottom: 12px; color: #111; font-weight: 800; }
        .login-desc { font-size: 16px; color: #555; margin-bottom: 30px; font-weight: 500; line-height: 1.5; }
        .login-hint { font-size: 14px; color: #0056b3; font-weight: 600; display: block; margin-top: 4px; }
        
        .login-box input { 
            padding: 16px; margin: 10px 0 20px 0; 
            border: 1px solid #e9ecef; border-radius: 8px; width: 100%; 
            font-size: 18px; text-align: center; outline: none; transition: 0.2s; 
            background-color: #f8f9fa; box-sizing: border-box;
        }
        .login-box input:focus { border-color: #001529; background-color: #ffffff; }
        
        .login-box button { 
            padding: 16px; width: 100%; 
            background-color: #001529; color: white; 
            border: none; border-radius: 8px; cursor: pointer; 
            font-weight: 700; font-size: 18px; transition: 0.2s; 
        }
        .login-box button:hover { background-color: #003366; }

        /* 2. 메인 대시보드 */
        #main-screen { display: none; }
        .header-title { padding-bottom: 15px; margin-bottom: 40px; text-align: center; font-size: 28px; font-weight: 800; color: #111; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .session-btn {
            background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px;
            padding: 30px 10px; font-size: 20px; font-weight: 700; color: #333;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .session-btn:hover { background: #f8f9fa; border-color: #0d47a1; color: #0d47a1; }

        /* 3. 상세 화면 */
        #detail-screen { display: none; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #111; padding-bottom: 15px; }
        .detail-header h2 { font-size: 24px; font-weight: 800; color: #111; margin: 0; }
        .back-btn { padding: 8px 16px; background: #e9ecef; color: #444; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background: #dee2e6; color: #111; }
        
        /* 버튼 상단 고정 영역 */
        .top-link-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; }
        .action-btn { padding: 14px 28px; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: 700; transition: all 0.2s; }
        .action-btn.survey { background: #001529; color: #ffffff; }
        .action-btn.sheet { background: #ffffff; color: #001529; border: 1px solid #001529; }
        .action-btn.survey:hover { background: #003366; }
        .action-btn.sheet:hover { background: #f8f9fa; }

        /* 데이터 영역 (투박함 제거, 플랫한 연회색 박스) */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: #f8f9fa; padding: 30px 20px; border-radius: 12px; text-align: center; border: 1px solid #f1f3f5; }
        .stat-card h4 { margin: 0 0 12px 0; color: #666; font-size: 16px; font-weight: 600; }
        .stat-card .value { font-size: 34px; font-weight: 800; color: #111; }
        .stat-card .value span { font-size: 34px; font-weight: 800; }

        #loading { text-align: center; font-size: 18px; color: #555; margin: 40px 0; font-weight: 600; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="panel login-box">
            <h2>🔒 2026 LH SCP 만족도 관리자</h2>
            <div class="login-desc">
                관리자 비밀번호를 입력해 주세요.<br>
                <span class="login-hint">(힌트 : 김지후 대리)</span>
            </div>
            <input type="password" id="pw-input" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) checkPassword()">
            <br>
            <button onclick="checkPassword()">입장하기</button>
        </div>
    </div>

    <div id="main-screen" class="panel">
        <h2 class="header-title">교육 만족도 차수 선택</h2>
        <div class="grid-container" id="button-grid">
            <!-- 버튼 자동 생성 -->
        </div>
    </div>

    <div id="detail-screen" class="panel">
        <div class="detail-header">
            <h2 id="detail-title">O차수 교육 만족도 현황</h2>
            <button class="back-btn" onclick="showMainScreen()">← 목록으로</button>
        </div>
        
        <div class="top-link-group">
            <a href="#" id="link-survey" target="_blank" class="action-btn survey">설문 링크 열기</a>
            <a href="#" id="link-sheet" target="_blank" class="action-btn sheet">원본 데이터 열기</a>
        </div>

        <div id="loading">데이터를 실시간으로 불러오는 중입니다... ⏳</div>

        <div id="detail-content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>1일차 응답 수</h4>
                    <div class="value"><span id="day1-count">-</span></div>
                </div>
                <div class="stat-card">
                    <h4>2~3일차 응답 수</h4>
                    <div class="value"><span id="day2-count">-</span></div>
                </div>
                <div class="stat-card">
                    <h4>정량평가 통합 평균</h4>
                    <div class="value"><span id="avg-score">-</span>점</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PW = "6611"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxcnkKyQ6xSp8g9OsotYCP6hKj-3AKgcvI_aUKVYGzt7LU8Kx36i6T3y02WMY8ZbzWs/exec"; 
        
        const sheetData = {
            5: { id: "1OdQrGuEouQDczRtmetVOstX9HKNQUTXigwyL-kchFio" },
            6: { id: "" },
            7: { id: "" },
            8: { id: "" },
            9: { id: "" },
            10: { id: "" },
            11: { id: "" },
            12: { id: "" }
        };

        const sessions = [5, 6, 7, 8, 9, 10, 11, 12];

        function checkPassword() {
            if (document.getElementById('pw-input').value === ADMIN_PW) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                renderButtons();
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        function renderButtons() {
            const grid = document.getElementById('button-grid');
            grid.innerHTML = '';
            sessions.forEach(session => {
                let btn = document.createElement('button');
                btn.className = 'session-btn';
                btn.innerText = session + "차수";
                btn.onclick = () => showDetailScreen(session);
                grid.appendChild(btn);
            });
        }

        function showMainScreen() {
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        async function showDetailScreen(session) {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
            
            document.getElementById('detail-title').innerText = `${session}차수 교육 만족도 현황`;
            
            document.getElementById('link-survey').href = `https://dallimandudu.github.io/LH-SCP-Subey_${session}st/`;
            const sheetId = sheetData[session].id;
            document.getElementById('link-sheet').href = sheetId ? `https://docs.google.com/spreadsheets/d/${sheetId}/edit` : "#";

            document.getElementById('detail-content').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            if (!sheetId) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('detail-content').style.display = 'block';
                document.getElementById('day1-count').innerText = "시트없음";
                document.getElementById('day2-count').innerText = "-";
                document.getElementById('avg-score').innerText = "-";
                return;
            }

            try {
                const response = await fetch(`${GAS_URL}?sheetId=${sheetId}`);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('detail-content').style.display = 'block';

                if (data.status === "success") {
                    document.getElementById('day1-count').innerText = data.day1Count + "명";
                    document.getElementById('day2-count').innerText = data.day2_3Count + "명";
                    document.getElementById('avg-score').innerText = data.avgScore;
                } else {
                    alert("데이터를 불러오지 못했습니다: " + data.message);
                }
            } catch (error) {
                alert("통신 오류가 발생했습니다.");
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
